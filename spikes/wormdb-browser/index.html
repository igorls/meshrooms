<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WormDB in the browser: spike</title>
  <style>
    :root { color-scheme: light dark; font: 14px/1.6 system-ui, sans-serif; }
    body { max-width: 760px; margin: 32px auto; padding: 0 16px; }
    table { border-collapse: collapse; width: 100%; margin-top: 16px; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #8884; }
    .pass { color: #1a7f4b; font-weight: 600; } .fail { color: #b3261e; font-weight: 600; }
    button { font: inherit; padding: 6px 12px; margin-right: 8px; }
    code { font-size: 12px; }
  </style>
</head>
<body>
  <h1>WormDB in the browser</h1>
  <p>Step-1 gates from the room's roadmap decision. <code>js</code> is a reference log that sets the OPFS baseline; <code>wasm</code> loads <code>wormdb.wasm</code> from this folder.</p>
  <p>
    <label>Engine <select id="engine"><option value="js">js (reference)</option><option value="wasm">wasm (WormDB core)</option></select></label>
    <button id="run">Run gates</button>
  </p>
  <table><thead><tr><th>Gate</th><th>Target</th><th>Result</th><th></th></tr></thead><tbody id="results"></tbody></table>
  <p id="note"></p>
  <script type="module" src="bench.js"></script>
</body>
</html>
