# Http-context configuration for the Meshrooms site: request-limit zones, redacted access-log format, and fallback
# error-page CSP map. Install as /etc/nginx/conf.d/meshrooms-limits.conf BEFORE the site file and browser snippet:
# nginx -t fails on a zone, log_format, or map variable that is not defined.
#
# The room service keeps its own quotas (per IPv4 address, per IPv6 /64 and /48). These sit in front of it and shed a
# flood before it costs the service a signature check or a database read.

# Bucket IPv4 per address (including IPv4-mapped IPv6) and canonical RFC 5952 IPv6 by its /64 prefix,
# matching the coordinator's addressKey() so rotating IIDs within one /64 shares a single per-address quota.
map $remote_addr $meshrooms_addr_key {
    ~^(\d+\.\d+\.\d+\.\d+)$                                                        $1;
    ~*^::ffff:(\d+\.\d+\.\d+\.\d+)$                                                $1;
    ~*^([0-9a-f]+:[0-9a-f]+:[0-9a-f]+:[0-9a-f]+):                                  $1::/64;
    ~*^([0-9a-f]+:[0-9a-f]+:[0-9a-f]+)::                                           $1:0::/64;
    ~*^([0-9a-f]+:[0-9a-f]+)::([0-9a-f]+):[0-9a-f]+:[0-9a-f]+:[0-9a-f]+:[0-9a-f]+$ $1:0:$2::/64;
    ~*^([0-9a-f]+:[0-9a-f]+)::                                                     $1:0:0::/64;
    ~*^([0-9a-f]+)::([0-9a-f]+):[0-9a-f]+:[0-9a-f]+:[0-9a-f]+:[0-9a-f]+$           $1:0:0:$2::/64;
    ~*^([0-9a-f]+)::                                                               $1:0:0:0::/64;
    ~*^::([0-9a-f]+:[0-9a-f]+):[0-9a-f]+:[0-9a-f]+:[0-9a-f]+:[0-9a-f]+$            0:0:$1::/64;
    ~*^::([0-9a-f]+):[0-9a-f]+:[0-9a-f]+:[0-9a-f]+:[0-9a-f]+$                      0:0:0:$1::/64;
    ~*^::                                                                          0:0:0:0::/64;
    default                                                                        $binary_remote_addr;
}

# GET /api/lobby/health is exempt from the shared site ceiling (an empty key is never counted), so a flood on
# /api/lobby cannot starve the 2-minute uptime probe. It still counts against its sender's per-address zone. It has
# no global zone of its own: one bucket shared by everyone would let a single address hold every health check,
# the probe's and a deploy's included, at 429, and the health read costs the service little.
map "$request_method:$uri" $meshrooms_all_key {
    "GET:/api/lobby/health" "";
    default                 all;
}

# One address (IPv4) or one IPv6 /64. Behind Nginx the room service allows 1,200 lobby requests a minute per IPv4
# address or IPv6 /64 (20 r/s); the burst absorbs a page load's assets and initial room fetches.
limit_req_zone $meshrooms_addr_key zone=meshrooms_addr:10m rate=20r/s;
# Everyone together: a ceiling for what one host serves, whatever the number of addresses a flood comes from.
limit_req_zone $meshrooms_all_key zone=meshrooms_all:1m rate=400r/s;
# Access-log redaction: strip query strings (e.g. avatar ?h=<hash> or accidental params) and replace room or member
# UUIDs in both the request URI and Referer with <id> before writing access logs. Route prefixes and path shapes stay
# readable for operations without recording room URLs or identifiers.
map $request_uri $meshrooms_log_path {
    ~^([^?]*)\? $1;
    default     $request_uri;
}

map $meshrooms_log_path $meshrooms_log_uri_1 {
    '~*^(/api/lobby/rooms/)[0-9a-fA-F]{8}(?:-|%2d)[0-9a-fA-F]{4}(?:-|%2d)[0-9a-fA-F]{4}(?:-|%2d)[0-9a-fA-F]{4}(?:-|%2d)[0-9a-fA-F]{12}(/avatars/)[0-9a-fA-F]{8}(?:-|%2d)[0-9a-fA-F]{4}(?:-|%2d)[0-9a-fA-F]{4}(?:-|%2d)[0-9a-fA-F]{4}(?:-|%2d)[0-9a-fA-F]{12}(.*)$' "$1<id>$2<id>$3";
    '~*^(/api/lobby/rooms/)[0-9a-fA-F]{8}(?:-|%2d)[0-9a-fA-F]{4}(?:-|%2d)[0-9a-fA-F]{4}(?:-|%2d)[0-9a-fA-F]{4}(?:-|%2d)[0-9a-fA-F]{12}(.*)$' "$1<id>$2";
    '~*^(/r/)[0-9a-fA-F]{8}(?:-|%2d)[0-9a-fA-F]{4}(?:-|%2d)[0-9a-fA-F]{4}(?:-|%2d)[0-9a-fA-F]{4}(?:-|%2d)[0-9a-fA-F]{12}(.*)$' "$1<id>$2";
    '~*^(/agent/)[0-9a-fA-F]{8}(?:-|%2d)[0-9a-fA-F]{4}(?:-|%2d)[0-9a-fA-F]{4}(?:-|%2d)[0-9a-fA-F]{4}(?:-|%2d)[0-9a-fA-F]{12}(.*)$' "$1<id>$2";
    '~*^(.*?)[0-9a-fA-F]{8}(?:-|%2d)[0-9a-fA-F]{4}(?:-|%2d)[0-9a-fA-F]{4}(?:-|%2d)[0-9a-fA-F]{4}(?:-|%2d)[0-9a-fA-F]{12}(.*)$' "$1<id>$2";
    default $meshrooms_log_path;
}

map $meshrooms_log_uri_1 $meshrooms_log_uri_2 {
    '~*^(.*?)[0-9a-fA-F]{8}(?:-|%2d)[0-9a-fA-F]{4}(?:-|%2d)[0-9a-fA-F]{4}(?:-|%2d)[0-9a-fA-F]{4}(?:-|%2d)[0-9a-fA-F]{12}(.*)$' "$1<id>$2";
    default $meshrooms_log_uri_1;
}

# Fail-closed final pass: if a malformed path still contains additional UUIDs, truncate from the next UUID onward.
map $meshrooms_log_uri_2 $meshrooms_log_uri {
    '~*^(.*?)[0-9a-fA-F]{8}(?:-|%2d)[0-9a-fA-F]{4}(?:-|%2d)[0-9a-fA-F]{4}(?:-|%2d)[0-9a-fA-F]{4}(?:-|%2d)[0-9a-fA-F]{12}.*$' "$1<id><redacted>";
    default $meshrooms_log_uri_2;
}

map $http_referer $meshrooms_log_referer_path {
    ""          "-";
    ~^([^?]*)\? $1;
    default     $http_referer;
}

map $meshrooms_log_referer_path $meshrooms_log_referer_1 {
    '~*^(.*?)[0-9a-fA-F]{8}(?:-|%2d)[0-9a-fA-F]{4}(?:-|%2d)[0-9a-fA-F]{4}(?:-|%2d)[0-9a-fA-F]{4}(?:-|%2d)[0-9a-fA-F]{12}(.*)$' "$1<id>$2";
    default $meshrooms_log_referer_path;
}

map $meshrooms_log_referer_1 $meshrooms_log_referer {
    '~*^(.*?)[0-9a-fA-F]{8}(?:-|%2d)[0-9a-fA-F]{4}(?:-|%2d)[0-9a-fA-F]{4}(?:-|%2d)[0-9a-fA-F]{4}(?:-|%2d)[0-9a-fA-F]{12}.*$' "$1<id><redacted>";
    default $meshrooms_log_referer_1;
}

log_format meshrooms_redacted '$remote_addr - - [$time_local] '
                              '"$request_method $meshrooms_log_uri $server_protocol" '
                              '$status $body_bytes_sent '
                              '"$meshrooms_log_referer" "$http_user_agent"';

# Fallback CSP for Nginx-generated errors (413, 429, 502/503/504) on proxied browser routes where the coordinator did
# not respond. Evaluates to empty when upstream already sent Content-Security-Policy, so Nginx omits the header instead
# of duplicating it.
map $upstream_http_content_security_policy $meshrooms_fallback_csp {
    volatile;
    ""      "default-src 'none'; frame-ancestors 'none'";
    default "";
}
