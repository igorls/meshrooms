proxy_pass http://127.0.0.1:4320;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For "";
proxy_set_header Connection "";
proxy_connect_timeout 3s;
proxy_read_timeout 15s;
client_max_body_size 24k;
# Hide fixed security headers already sent by the coordinator so Nginx emits them once with `always`
# (covering Nginx-generated 413/429/5xx errors without duplicating headers on upstream responses).
# Content-Security-Policy and Cache-Control remain coordinator-owned per route, with a fallback CSP
# emitted only when upstream did not supply one.
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header X-Frame-Options;
add_header Strict-Transport-Security "max-age=15552000" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header X-Frame-Options DENY always;
add_header Content-Security-Policy $meshrooms_fallback_csp always;
