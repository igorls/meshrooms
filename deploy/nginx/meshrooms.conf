server {
    listen 80;
    listen [::]:80;
    server_name meshrooms.wormdb.dev;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / { return 308 https://meshrooms.wormdb.dev$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name meshrooms.wormdb.dev;
    ssl_certificate /etc/letsencrypt/live/meshrooms.wormdb.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meshrooms.wormdb.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MeshroomsSSL:10m;
    ssl_session_timeout 1d;

    root /var/www/meshrooms/current;
    index index.html;
    server_tokens off;
    autoindex off;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=86400" always;
    # Assets have stable names. Revalidate them when a release changes.
    add_header Cache-Control no-cache always;

    error_page 404 /404.html;
    # The application owns CSP for these routes. Setting HSTS in each location
    # prevents inheriting the static site's connect-src 'none' policy.
    location = /rooms { include /etc/nginx/snippets/meshrooms-browser.conf; }
    location ^~ /r/ { include /etc/nginx/snippets/meshrooms-browser.conf; }
    location ^~ /api/lobby { include /etc/nginx/snippets/meshrooms-browser.conf; }
    location ^~ /agent/ { include /etc/nginx/snippets/meshrooms-browser.conf; }
    location /assets/ { try_files $uri @browser_asset; }
    location @browser_asset { include /etc/nginx/snippets/meshrooms-browser.conf; }
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { return 404; }
}
