server {
    listen 80;
    listen [::]:80;
    server_name meshrooms.wormdb.dev;
    server_tokens off;

    access_log /var/log/nginx/meshrooms-access.log meshrooms_redacted;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / { return 308 https://meshrooms.wormdb.dev$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name meshrooms.wormdb.dev;
    ssl_certificate /etc/letsencrypt/live/meshrooms.wormdb.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meshrooms.wormdb.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MeshroomsSSL:10m;
    ssl_session_timeout 1d;

    root /var/www/meshrooms/current;
    index index.html;
    server_tokens off;
    autoindex off;

    access_log /var/log/nginx/meshrooms-access.log meshrooms_redacted;

    # Zones from /etc/nginx/conf.d/meshrooms-limits.conf, for every location of this site. Requests over the burst
    # are refused at once (nodelay), with the status the room service uses for its own quotas.
    limit_req zone=meshrooms_addr burst=60 nodelay;
    limit_req zone=meshrooms_all burst=400 nodelay;
    limit_req_status 429;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=15552000" always;
    # Assets have stable names. Revalidate them when a release changes.
    add_header Cache-Control no-cache always;

    error_page 404 /404.html;
    # Pages declare /assets/mark.svg; answer default /favicon.ico probes cleanly without noisy 404 logs
    # while inheriting all server-level security headers.
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }
    # MeshGuard's authenticated browser transport gateway shares this host name; it listens only on loopback.
    location = /meshguard-web/ws {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
    location = /meshguard-web/health {
        proxy_pass http://127.0.0.1:4321;
        proxy_connect_timeout 3s;
    }
    # The application owns CSP for these routes. Setting add_header directives inside
    # meshrooms-browser.conf prevents inheriting the static site's connect-src 'none' policy.
    location = /rooms { include /etc/nginx/snippets/meshrooms-browser.conf; }
    location ^~ /r/ { include /etc/nginx/snippets/meshrooms-browser.conf; }
    location ^~ /api/lobby {
        include /etc/nginx/snippets/meshrooms-browser.conf;
        # Return JSON when Nginx's own limit_req rejects a lobby call, so browsers and bridges read status 429 cleanly.
        # Upstream 429s from the coordinator pass straight through (proxy_intercept_errors stays off).
        error_page 429 @lobby_rate_limit;
    }
    # E2E encrypted WSS relay endpoint: upgrade to WebSocket on the same loopback service with 75s read timeout
    # (heartbeat ping runs every 25s).
    location = /api/relay/v1 {
        proxy_pass http://127.0.0.1:4320;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header X-Frame-Options;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy $meshrooms_fallback_csp always;
        error_page 429 @lobby_rate_limit;
    }
    # Ephemeral cloud-agent sealed state (up to 256 KB opaque ciphertext blob plus signed command wrapper).
    location = /api/relay/v1/state {
        proxy_pass http://127.0.0.1:4320;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        client_max_body_size 300k;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header X-Frame-Options;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy $meshrooms_fallback_csp always;
        error_page 429 @lobby_rate_limit;
    }
    # HTTPS relay fallback (open, send, poll, wake-register): 64k max body and 40s read timeout for 25s long-polls.
    location ^~ /api/relay/v1/ {
        proxy_pass http://127.0.0.1:4320;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 40s;
        client_max_body_size 64k;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header X-Frame-Options;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy $meshrooms_fallback_csp always;
        error_page 429 @lobby_rate_limit;
    }
    location @lobby_rate_limit {
        default_type application/json;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        return 429 '{"error":"Too many requests. Try again shortly."}';
    }
    location ^~ /agent/ { include /etc/nginx/snippets/meshrooms-browser.conf; }
    location /assets/ { try_files $uri @browser_asset; }
    location @browser_asset { include /etc/nginx/snippets/meshrooms-browser.conf; }
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { return 404; }
}
