# First issuance only. Replace with meshrooms.conf after obtaining the certificate.
server {
    listen 80;
    listen [::]:80;
    server_name meshrooms.wormdb.dev;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / { return 404; }
}
