[package]
name = "meshrooms-desktop"
version = "0.1.0-alpha.3"
description = "Menu-bar shell for the local Meshrooms daemon"
edition = "2021"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Stripped proc-macro dylibs fail to load under recent macOS dyld ("mis-aligned LINKEDIT").
[profile.release.build-override]
strip = false
