[package]
name = "meshrooms-desktop"
version = "0.1.0-alpha.5"
description = "Tray app that keeps the Meshrooms agent daemon running"
edition = "2021"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# Match the existing Tauri 2.11 lock; newer 2.6.x requires a core upgrade.
tauri-plugin-deep-link = "=2.4.9"
url = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde_json = "1"
sha2 = "0.10"

# Windows: toasts with a click callback, which the notification plugin has none of on desktop. Already in the tree
# through the plugin's notify-rust, at the same version.
[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Stripped proc-macro dylibs fail to load under recent macOS dyld ("mis-aligned LINKEDIT").
[profile.release.build-override]
strip = false
