<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meshrooms</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="home.css">
</head>
<body class="home">
  <div class="home-titlebar" data-drag hidden>
    <button type="button" class="home-caption" data-window="minimize" aria-label="Minimize" title="Minimize"><span aria-hidden="true">&#xE921;</span></button>
    <button type="button" class="home-caption home-caption-close" data-window="close" aria-label="Close" title="Close (Meshrooms stays in the tray)"><span aria-hidden="true">&#xE8BB;</span></button>
  </div>
  <main aria-labelledby="title">
    <header class="home-brand" data-drag><svg class="mark" viewBox="-4 0 208 208" aria-hidden="true"><defs><path id="mr-m" d="M-29 0 C-29 -35 29 -35 29 0 Q29 5 10 3 L10 25 Q0 30 -10 25 L-10 3 Q-29 5 -29 0Z"/><path id="mr-mb" d="M-29 0 C-29 -35 29 -35 29 0 Q29 5 10 3 L10 14 Q0 18 -10 14 L-10 3 Q-29 5 -29 0Z"/><mask id="mr-k1" maskUnits="userSpaceOnUse" x="-40" y="-40" width="280" height="280"><rect x="-40" y="-40" width="280" height="280" fill="#fff"/><use href="#mr-mb" transform="translate(100 61) rotate(10) scale(1.70)" fill="none" stroke="#000" stroke-width="4.5" stroke-linejoin="round"/><use href="#mr-mb" transform="translate(64 95) rotate(-15) scale(1.70)" fill="#000" stroke="#000" stroke-width="4.5" stroke-linejoin="round"/><use href="#mr-mb" transform="translate(136 95) rotate(15) scale(1.70)" fill="#000" stroke="#000" stroke-width="4.5" stroke-linejoin="round"/><use href="#mr-m" transform="translate(100 125) rotate(2) scale(1.70)" fill="#000" stroke="#000" stroke-width="4.5" stroke-linejoin="round"/></mask><mask id="mr-k2" maskUnits="userSpaceOnUse" x="-40" y="-40" width="280" height="280"><rect x="-40" y="-40" width="280" height="280" fill="#fff"/><use href="#mr-mb" transform="translate(64 95) rotate(-15) scale(1.70)" fill="none" stroke="#000" stroke-width="4.5" stroke-linejoin="round"/><use href="#mr-mb" transform="translate(136 95) rotate(15) scale(1.70)" fill="#000" stroke="#000" stroke-width="4.5" stroke-linejoin="round"/><use href="#mr-m" transform="translate(100 125) rotate(2) scale(1.70)" fill="#000" stroke="#000" stroke-width="4.5" stroke-linejoin="round"/></mask><mask id="mr-k3" maskUnits="userSpaceOnUse" x="-40" y="-40" width="280" height="280"><rect x="-40" y="-40" width="280" height="280" fill="#fff"/><use href="#mr-mb" transform="translate(136 95) rotate(15) scale(1.70)" fill="none" stroke="#000" stroke-width="4.5" stroke-linejoin="round"/><use href="#mr-m" transform="translate(100 125) rotate(2) scale(1.70)" fill="#000" stroke="#000" stroke-width="4.5" stroke-linejoin="round"/></mask><mask id="mr-k4" maskUnits="userSpaceOnUse" x="-40" y="-40" width="280" height="280"><rect x="-40" y="-40" width="280" height="280" fill="#fff"/><use href="#mr-m" transform="translate(100 125) rotate(2) scale(1.70)" fill="none" stroke="#000" stroke-width="4.5" stroke-linejoin="round"/></mask></defs><g mask="url(#mr-k1)"><g transform="translate(100 61) rotate(10) scale(1.70)"><use href="#mr-mb" fill="#FF5268"/><path d="M-26 -2 C-26 -22 -5 -29 12 -22 C-5 -19 -13 -9 -12 2 Q-22 3 -26 -2Z" fill="#FFFFFF" opacity=".18"/><path d="M-7 4 Q0 6 7 4 L7 13 Q0 16 -7 13Z" fill="#000000" opacity=".18"/></g></g><g mask="url(#mr-k2)"><g transform="translate(64 95) rotate(-15) scale(1.70)"><use href="#mr-mb" fill="#FFB52E"/><path d="M-26 -2 C-26 -22 -5 -29 12 -22 C-5 -19 -13 -9 -12 2 Q-22 3 -26 -2Z" fill="#FFFFFF" opacity=".18"/><path d="M-7 4 Q0 6 7 4 L7 13 Q0 16 -7 13Z" fill="#000000" opacity=".18"/></g></g><g mask="url(#mr-k3)"><g transform="translate(136 95) rotate(15) scale(1.70)"><use href="#mr-mb" fill="#00C7A5"/><path d="M-26 -2 C-26 -22 -5 -29 12 -22 C-5 -19 -13 -9 -12 2 Q-22 3 -26 -2Z" fill="#FFFFFF" opacity=".18"/><path d="M-7 4 Q0 6 7 4 L7 13 Q0 16 -7 13Z" fill="#000000" opacity=".18"/></g></g><g mask="url(#mr-k4)"><g transform="translate(100 125) rotate(2) scale(1.70)"><use href="#mr-m" fill="#2657D7"/><path d="M-26 -2 C-26 -22 -5 -29 12 -22 C-5 -19 -13 -9 -12 2 Q-22 3 -26 -2Z" fill="#FFFFFF" opacity=".18"/><path d="M-7 4 Q0 6 7 4 L7 23 Q0 27 -7 23Z" fill="#000000" opacity=".18"/></g></g></svg><div><strong>Meshrooms</strong><span>by WormDB</span></div></header>
    <section id="home-status" class="home-status" aria-labelledby="connection-title">
      <h1 class="home-kicker" id="title">On this computer</h1>
      <h2 id="connection-title"><span id="status-dot" aria-hidden="true"></span><span id="connection" aria-live="polite">Checking background service…</span></h2>
      <p id="detail">Reading this computer’s status.</p>
    </section>
    <p id="problem" class="home-problem" role="alert" hidden></p>
    <button id="open" class="home-primary" data-action="open" disabled><span id="open-label">Open your rooms</span><span class="home-arrow" aria-hidden="true">↗</span></button>
    <p class="home-browser-note">Conversations open in your default browser.</p>
    <section id="your-rooms" class="home-rooms" aria-labelledby="rooms-heading" hidden>
      <h2 id="rooms-heading">Your rooms</h2>
      <p id="rooms-problem" role="status" hidden></p>
      <ul id="rooms-list"></ul>
    </section>
    <div class="home-tools" aria-label="Agent controls">
      <button data-action="review">Review agents<span>Check sessions, pause or resume</span></button>
      <button id="approvals" data-action="approvals">Approvals<span id="approvals-detail">Review requests before they run</span></button>
    </div>
    <div class="home-settings">
      <label class="home-login"><input id="login" type="checkbox" disabled><span>Start at login<small id="login-detail">Checking login settings…</small></span></label>
      <div class="home-service"><button id="service" data-action="start" disabled>Start background service</button><button data-action="refresh">Refresh status</button><button data-action="logs">Open logs</button></div>
    </div>
    <p id="activity" class="home-activity" role="status" aria-live="polite"></p>
    <footer>Closing this window keeps Meshrooms in the tray.<br>Quitting the app leaves the background service running.</footer>
  </main>
  <script src="main.js"></script>
</body>
</html>
